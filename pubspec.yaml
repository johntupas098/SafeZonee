name: emergency_response_app
description: LIVE Real-time Emergency Response App

publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.1.0 <4.0.0'
  flutter: ">=3.13.0"

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.6
  geolocator: ^13.0.0
  google_maps_flutter: ^2.5.3
  flutter_spinkit: ^5.2.1
  permission_handler: ^12.0.1
  http: ^1.1.0
  url_launcher: ^6.3.2
  stream_channel: ^2.1.1
  socket_io_client: ^3.1.4
  image_picker: ^1.0.7
  supabase_flutter: ^2.8.0
  flutter_webrtc: ^1.4.1
  metered_realtime: ^0.2.0
  audio_session: ^0.1.21
  device_info_plus: ^13.2.0
  flutter_local_notifications: ^17.0.0
  firebase_core: ^3.15.2
  firebase_messaging: ^15.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.13.1

flutter:
  uses-material-design: true
  assets:
    - assets/logo.jpg

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/logo.jpg"
  min_sdk_android: 21
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "assets/logo.jpg"